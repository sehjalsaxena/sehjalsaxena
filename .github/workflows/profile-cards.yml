
name: Refresh GitHub Profile Cards

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: sehjalsaxena
          cards: overview,languages
          output-dir: assets
          themes: light,dark
          commit: true
